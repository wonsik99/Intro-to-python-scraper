<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ keyword }} jobs | Job Scrapper</title>
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f6f8; color: #1f2328; }
        main { max-width: 760px; margin: 48px auto; padding: 0 16px; }
        header { text-align: center; }
        header p { color: #59636e; }
        a { color: #0969da; }
        h2 { margin-top: 40px; padding-bottom: 8px; border-bottom: 2px solid #d0d7de; font-size: 20px; }
        h2 span { color: #59636e; font-weight: normal; }
        .job { display: block; margin: 12px 0; padding: 16px; border: 1px solid #d0d7de; border-radius: 8px; background: white; color: #59636e; text-decoration: none; }
        .job:hover { border-color: #0969da; }
        .job strong { display: block; margin-bottom: 4px; color: #0969da; }
        .empty { color: #59636e; }
    </style>
</head>
<body>
    <main>
        <header>
            <h1>Results for "{{ keyword }}"</h1>
            <p>{{ total }} jobs · updated {{ updated }}</p>
            <a href="../../">← Search again</a>
        </header>

        {% for site, jobs in jobs_by_site.items() %}
            <h2>{{ site }} <span>({{ jobs|length }})</span></h2>
            {% for job in jobs %}
                <a class="job" href="{{ job.job_link }}" target="_blank" rel="noopener">
                    <strong>{{ job.job_title }}</strong>
                    {{ job.company_name }}
                </a>
            {% else %}
                <p class="empty">No jobs found</p>
            {% endfor %}
        {% endfor %}
    </main>
</body>
</html>
