<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Scrapper</title>
</head>
<body>
    <h1>Search Results for "{{ keyword }}":</h1>
    {% if jobs %}
    <ul>
      {% for job in jobs %}
        <li>
          <a href="{{ job.job_link }}" target="_blank">
            <strong>{{ job.job_title }}</strong>
          </a> — {{ job.company_name }}
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>No jobs found</p>
  {% endif %}
</body>
</html>
